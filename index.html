            padding: 20px;
            background-image:

        }

        .game-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 3px solid var(--primary);
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            padding: 24px;
            text-align: center;
        }

            font-family: 'Fredoka One', cursive;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .content {
            padding: 28px;
        }

            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 0 #D97706;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background: #D97706;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        /* Tampilan Soal */
        .progress-bar-container {
            width: 100%;
            background: var(--border);
            height: 10px;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            width: 0%;
            transition: width 0.3s ease;
        }

        .quiz-info {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 16px;
            color: var(--text-muted);
        }

            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
            line-height: 1.6;
            white-space: pre-line;
        }

        .image-container {

            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            text-align: center;
        }

        .image-container img {
            max-width: 100%;
            height: auto;
            max-height: 260px;
            border-radius: 8px;
            object-fit: contain;
        }

            display: flex;
            flex-direction: column;
            gap: 12px;

            background: #FFFFFF;
            border: 2px solid var(--border);

            padding: 14px 18px;
            text-align: left;
            font-size: 15px;

            align-items: center;

</head>

<div class="game-container">
    <div class="header">
        <h1>🧵 ASESMEN TENGAH SEMESTER PRAKARYA 🎨</h1>
        <p>SMP DHAMMĀSOKA BANJARMASIN — KELAS IX (50 SOAL)</p>
    </div>

    <div class="content">
        <!-- 1. REGISTRASI IDENTITAS -->
        <div id="start-screen" class="screen active">
            <h2 style="margin-bottom: 16px; font-size: 18px;">Pendaftaran Peserta Ujian</h2>
            <form id="identity-form" onsubmit="startGame(event)">
                <div class="input-group">
                    <label for="student-name">Nama Lengkap Siswa:</label>
                    <input type="text" id="student-name" placeholder="Masukkan nama..." required>
                </div>
                <div class="input-group">
                    <label for="student-class">Kelas:</label>
                    <select id="student-class" required>
                        <option value="">-- Pilih Kelas --</option>
                        <option value="IX A">IX A</option>
                        <option value="IX B">IX B</option>
                        <option value="IX C">IX C</option>
                        <option value="IX D">IX D</option>
                    </select>
                </div>
                <button type="submit" class="btn">🚀 MULAI KERJAKAN</button>
            </form>
        </div>

        <!-- 2. GAMEPLAY SOAL -->
        <div id="quiz-screen" class="screen">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="quiz-info">
                <span id="player-info-display"></span>
                <span id="question-count"></span>
            </div>
            
            <div class="question-text" id="question-text"></div>
            
            <div class="image-container" id="image-container" style="display:none;">
                <img id="question-image" src="" alt="Gambar Soal">
            </div>

            <div class="options-container" id="options-container"></div>

            <div class="navigation-btns">
                <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" style="display:none;">Sebelumnya</button>
                <button class="btn" id="next-btn" onclick="nextQuestion()">Selanjutnya</button>
            </div>
        </div>

        <!-- 3. HASIL SKOR -->
        <div id="result-screen" class="screen">
            <div class="result-card">
                <h2>🎉 Ujian Selesai! 🎉</h2>
                <p>Terima kasih telah menyelesaikan Asesmen Tengah Semester.</p>
                
                <div class="score-box">
                    <div>NILAI AKHIR</div>
                    <div class="score-number" id="final-score">0</div>
                    <div id="score-status" style="font-weight:600;"></div>
                </div>

                <div class="result-details">
                    <p><strong>Nama Siswa:</strong> <span id="res-name"></span></p>
                    <p><strong>Kelas:</strong> <span id="res-class"></span></p>
                    <p><strong>Jawaban Benar:</strong> <span id="res-correct" style="color: var(--correct); font-weight:bold;"></span></p>
                    <p><strong>Jawaban Salah:</strong> <span id="res-wrong" style="color: var(--wrong); font-weight:bold;"></span></p>
                    <p><strong>Total Soal:</strong> 50 Soal</p>
                </div>

                <div class="sending-status" id="sending-status"></div>
                <br>
                <button class="btn" onclick="restartGame()">🔄 Ulangi Game</button>
            </div>
        </div>
    </div>
</div>

                "menyulam kain menggunakan benang",
                "melukis kain menggunakan pensil"
            ],
            answer: 1
        },
        {

            imageUrl: "",
            options: [
                "agar kain menjadi lebih tebal",
                "mencegah bagian tertentu terkena pewarna",
                "mempercepat proses pengeringan",
                "membuat kain menjadi lebih berat"
            ],
            answer: 1
        },
        {

            imageUrl: "",
            options: ["Kain", "Kayu", "tanah liat", "kaca"],
            answer: 0
        },
        {
            question: "Setelah proses pewarnaan tie-dye selesai, kain sebaiknya ....",
            imageUrl: "",
            options: [
                "langsung dipotong",
                "dikeringkan dan kemudian ikatannya dilepas",
                "dibakar agar warnanya tahan lama",
                "direndam dalam minyak"
            ],
            answer: 1
        },
        {
            question: "Keunikan motif tie-dye terletak pada ....",
            imageUrl: "",
            options: [
                "motif yang selalu sama",
                "pola warna yang dihasilkan dari teknik ikat dan pewarnaan",
                "penggunaan kain yang harus berwarna hitam",
                "bentuk kain yang harus berbentuk persegi"
            ],
            answer: 1
        },
        {
            question: "Kerajinan adalah karya yang dibuat dengan keterampilan tangan dan memiliki nilai guna atau keindahan. Tujuan pembuatan karya kerajinan dalam kehidupan sehari-hari Adalah….",
            imageUrl: "",
            options: [
                "hanya untuk memenuhi tugas sekolah",
                "menghasilkan benda yang berguna dan memiliki nilai estetis",
                "membuat benda yang sulit digunakan",
                "menghabiskan bahan yang tersedia"
            ],
            answer: 1
        },
        {
            question: "Teknik ikat celup (tie-dye) adalah teknik membuat motif pada kain dengan cara …",
            imageUrl: "",
            options: [
                "melukis kain menggunakan pensil",
                "memotong kain menjadi berbagai bentuk",
                "mengikat atau melipat bagian kain kemudian mencelupkannya ke dalam pewarna",
                "menjahit kain menggunakan mesin jahit"
            ],
            answer: 2
        },
        {
            question: "Berikut ini yang termasuk alat dan bahan yang dapat digunakan untuk membuat kain dengan teknik ikat celup adalah …",

            options: [
                "kain putih, pewarna tekstil, karet/tali, wadah, dan sarung tangan",
                "kayu, paku, palu, dan cat minyak",

                "kertas, pensil, penghapus, dan penggaris"

        },

                "kain tie-dye hanya dapat digunakan sebagai pajangan"
            ],
            answer: 1
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let studentData = { name: "", class: "" };

    function startGame(e) {
        e.preventDefault();
        studentData.name = document.getElementById('student-name').value;
        studentData.class = document.getElementById('student-class').value;

        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');

        document.getElementById('player-info-display').innerText = `${studentData.name} (${studentData.class})`;
        loadQuestion();
    }

    function loadQuestion() {
        const data = quizData[currentQuestion];
        
        const progressPercentage = ((currentQuestion + 1) / quizData.length) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercentage}%`;
        document.getElementById('question-count').innerText = `Soal ${currentQuestion + 1} dari ${quizData.length}`;

        document.getElementById('question-text').innerText = `${currentQuestion + 1}. ${data.question}`;

        const imgContainer = document.getElementById('image-container');
        const imgElement = document.getElementById('question-image');
        
        if (data.imageUrl && data.imageUrl.trim() !== "") {
            imgElement.src = data.imageUrl;
            imgContainer.style.display = 'block';
        } else {
            imgContainer.style.display = 'none';
            imgElement.src = "";
        }

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        const labels = ['A', 'B', 'C', 'D'];
        data.options.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = `option-btn ${userAnswers[currentQuestion] === idx ? 'selected' : ''}`;
            btn.onclick = () => selectOption(idx);
            btn.innerHTML = `<strong>${labels[idx]}.</strong>&nbsp; ${opt}`;
            optionsContainer.appendChild(btn);
        });

        document.getElementById('prev-btn').style.display = currentQuestion > 0 ? 'block' : 'none';
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').innerText = "Selesai & Lihat Nilai";
        } else {
            document.getElementById('next-btn').innerText = "Selanjutnya";
        }
    }

    function selectOption(index) {
        userAnswers[currentQuestion] = index;
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach((btn, idx) => {
            btn.classList.toggle('selected', idx === index);
        });
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            loadQuestion();
        }
    }

    function nextQuestion() {
        if (userAnswers[currentQuestion] === null) {
            alert("Harap pilih salah satu jawaban sebelum melanjutkan!");
            return;
        }

        if (currentQuestion < quizData.length - 1) {
            currentQuestion++;
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');

        let correctCount = 0;
        quizData.forEach((q, idx) => {
            if (userAnswers[idx] === q.answer) {
                correctCount++;
            }
        });

        const wrongCount = quizData.length - correctCount;
        const score = Math.round((correctCount / quizData.length) * 100);

        document.getElementById('res-name').innerText = studentData.name;
        document.getElementById('res-class').innerText = studentData.class;
        document.getElementById('res-correct').innerText = `${correctCount} Soal`;
        document.getElementById('res-wrong').innerText = `${wrongCount} Soal`;
        document.getElementById('final-score').innerText = score;

        const statusElem = document.getElementById('score-status');
        if (score >= 80) {
            statusElem.innerText = "PRESTASI SANGAT BAIK! 🌟";
        } else if (score >= 70) {
            statusElem.innerText = "MEMENUHI KKM 👍";
        } else {
            statusElem.innerText = "PERLU BELAJAR LAGI 📚";
        }

        if (scriptURL && scriptURL.trim() !== "") {
            const statusText = document.getElementById('sending-status');
            statusText.innerText = "Mengirim nilai ke Google Spreadsheet...";

            const payload = {
                name: studentData.name,
                class: studentData.class,
                correct: correctCount,
                wrong: wrongCount,
                score: score
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                statusText.innerText = "✅ Hasil berhasil tersimpan di Spreadsheet!";
                statusText.style.color = "var(--correct)";
            })
            .catch(error => {
                console.error("Gagal mengirim data:", error);
                statusText.innerText = "⚠️ Gagal terhubung ke Spreadsheet (Nilai tetap tersimpan di layar).";
                statusText.style.color = "var(--wrong)";
            });
        }
    }

    function restartGame() {
        currentQuestion = 0;
        userAnswers = new Array(quizData.length).fill(null);
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('start-screen').classList.add('active');
        document.getElementById('identity-form').reset();
    }
</script>
